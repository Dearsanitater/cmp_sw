KafkaClient {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true
  storeKey=true
  keyTab="/root/tdhconf/tdhall.keytab"
  principal="kafka/tdh1@TDH";
};

// Zookeeper client authentication
Client {
  com.sun.security.auth.module.Krb5LoginModule required
  useKeyTab=true
  storeKey=true
  useTicketCache=false
  keyTab="D:/info/etc/tdhall.keytab"
  principal="hbase/tdh1@TDH";
};
